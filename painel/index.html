<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Briefings recebidos | Conecta Mais</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090e1b;color:#eff5ff;font:15px/1.6 system-ui,sans-serif}a{color:#59e4df;text-decoration:none}.wrap{width:min(1100px,calc(100% - 32px));margin:40px auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:35px}.brand{font-size:21px;font-weight:800;color:#eff5ff}.brand b{color:#59e4df}.card{padding:28px;border:1px solid #2b3c55;border-radius:16px;background:#111b2d;margin-bottom:20px}.login{max-width:470px;margin:70px auto}h1{font-size:29px;margin:0 0 12px;letter-spacing:-.8px}h2{font-size:20px;margin:0 0 10px}p,small{color:#a8b9cf}label{display:grid;gap:8px;font-size:13px}input{padding:13px;border-radius:9px;border:1px solid #465d7d;background:#090e1b;color:white;font:inherit;width:100%}input:focus{outline:2px solid #59e4df;outline-offset:2px}button{font:600 13px system-ui,sans-serif;cursor:pointer;padding:12px 18px;border:1px solid #4a789e;background:#22699b;color:#fff;border-radius:9px}button.secondary{background:transparent}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible{outline:2px solid #59e4df;outline-offset:4px}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}#status{min-height:24px;color:#59e4df;font-size:13px;white-space:pre-wrap}.items{display:grid;gap:12px}.item{padding:20px;background:#111b2d;border:1px solid #2b3c55;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:20px}.item h2{font-size:17px;margin:0 0 5px}.item p{font-size:12px;margin:0}.pagination{margin-top:22px;justify-content:center}#detail pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 ui-monospace,monospace;margin-top:25px;color:#d9e9fb}#detail{scroll-margin-top:20px}.muted{font-size:12px;color:#a8b9cf}[hidden]{display:none!important}@media(max-width:600px){.wrap{margin:24px auto}.card{padding:20px}.item{align-items:flex-start;flex-direction:column}.item .actions{width:100%}header{align-items:flex-start}.login{margin-top:35px}}
</style></head><body><div class="wrap"><header><a class="brand" href="../">Conecta <b>Mais</b></a><a href="../briefing/">Abrir formulário do cliente ↗</a></header><p id="status" role="status"></p><section class="card login" id="login"><h1>Seus briefings,<br>em um só lugar.</h1><p>Entre para consultar as respostas enviadas e baixar o arquivo de cada projeto.</p><form id="login-form"><label>Senha do painel<input id="password" type="password" required autocomplete="current-password" maxlength="200"></label><button style="width:100%;margin-top:20px" type="submit">Entrar no painel</button></form><p class="muted">Esta senha é exclusiva do painel. Não use sua senha da Cloudflare.</p></section><main id="dashboard" hidden><div class="toolbar"><div><h1>Briefings recebidos</h1><p style="margin:0">Do mais recente para o mais antigo.</p></div><div class="actions"><button id="refresh" class="secondary">Atualizar lista</button><button id="logout" class="secondary">Sair</button></div></div><div class="items" id="items"></div><div class="actions pagination"><button id="prev" class="secondary">Anteriores</button><span id="page" class="muted"></span><button id="next" class="secondary">Próximos</button></div><section class="card" id="detail" hidden><div class="toolbar"><h2 id="detail-title"></h2><div class="actions"><button id="download">Baixar TXT</button><button id="close" class="secondary">Fechar</button></div></div><p id="detail-date" class="muted"></p><pre id="detail-text"></pre></section></main></div><script src="painel.js"></script></body></html>
